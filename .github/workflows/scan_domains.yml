name: Batch Scan Domains Grid

on:
  workflow_dispatch:
    inputs:
      total_workers:
        description: 'Total number of parallel workers'
        required: true
        default: '20'
        type: string
      batch_size:
        description: 'Domains to process per worker (e.g. 100000)'
        required: true
        default: '40000'
        type: string
      threads:
        description: 'Concurrent threads per worker (e.g. 100)'
        required: true
        default: '50'
        type: string
      auto_loop:
        description: 'Automatically trigger the next run when finished (Requires PAT_TOKEN secret)'
        required: true
        default: false
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Generate a JSON array like [0, 1, 2, ..., N-1]
          WORKERS=${{ inputs.total_workers }}
          JSON_ARRAY=$(seq 0 $((WORKERS - 1)) | jq -R . | jq -s -c 'map(tonumber)')
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  scan:
    needs: setup
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub pandas pyarrow
          
      - name: Run Batch Scanner (Worker ${{ matrix.worker_id }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID || secrets.HF_REPO_ID }}
        run: |
          python batch_scanner.py --worker-id ${{ matrix.worker_id }} --total-workers ${{ inputs.total_workers }} --batch-size ${{ inputs.batch_size }} --threads ${{ inputs.threads }}

  merge:
    needs: scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub[hf_xet]" pandas "pyarrow>=14.0"
          
      - name: Run Merge Results
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID || secrets.HF_REPO_ID }}
        run: |
          python merge_results.py

      - name: Trigger Next Run (Auto Loop)
        if: ${{ inputs.auto_loop == 'true' || inputs.auto_loop == true }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Auto-loop is enabled! Triggering the next batch..."
          gh workflow run scan_domains.yml -f total_workers=${{ inputs.total_workers }} -f batch_size=${{ inputs.batch_size }} -f threads=${{ inputs.threads }} -f auto_loop=true
